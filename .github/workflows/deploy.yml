name: Deploy Quote Generator

on:
  workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Health Check
        id: healthcheck
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")

          echo "Status Code: $CODE"

          echo "health_code=$CODE" >> $GITHUB_OUTPUT

          if [ "$CODE" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi

          echo "Site healthy"
