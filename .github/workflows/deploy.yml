name: Deploy Quote Generator

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  validate:

    name: Validate Application

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Validate Required Files
        run: |

          set -e

          for file in index.html styles.css script.js; do

            if [ ! -s "$file" ]; then

              echo "::error::$file is missing or empty"

              exit 1

            fi

          done


          grep -q "styles.css" index.html || {

            echo "::error::styles.css is not referenced"

            exit 1

          }


          grep -q "script.js" index.html || {

            echo "::error::script.js is not referenced"

            exit 1

          }


          echo "Required files validated"


      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: "22"


      - name: Validate Source Code
        run: |

          set -e


          # JavaScript syntax
          node --check script.js


          # Install validators
          npm install --no-save \
            prettier@3 \
            html-validate@10 \
            stylelint@16 \
            stylelint-config-standard@39


          # Stylelint configuration
          cat > stylelint.config.mjs <<'EOF'
          export default {
            extends: ["stylelint-config-standard"]
          };
          EOF


          # HTML validation
          npx html-validate index.html


          # CSS validation
          npx stylelint styles.css


          # Formatting validation
          npx prettier --check \
            index.html \
            styles.css \
            script.js


          echo "Source validation successful"



  deploy:

    name: Deploy Application

    needs: validate

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Website
        uses: actions/upload-pages-artifact@v3

        with:

          path: app


      - name: Deploy to GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4


      - name: Production Health Check

        env:

          SITE_URL: ${{ steps.deployment.outputs.page_url }}


        run: |

          CODE="000"


          for ATTEMPT in 1 2 3; do


            CODE=$(curl \
              --silent \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$SITE_URL" || true)


            echo "Attempt $ATTEMPT: HTTP $CODE"


            if [ "$CODE" = "200" ]; then

              echo "Site is healthy"

              exit 0

            fi


            sleep 5

          done


          echo "::error::Health check failed with HTTP $CODE"

          exit 1
          
