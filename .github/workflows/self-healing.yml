name: AI Self Heal

on:

  workflow_run:

    workflows:
      - Deploy Quote Generator

    types:
      - completed


permissions:

  actions: read

  contents: write

  pull-requests: write


jobs:

  repair:

    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'self-healing'

    runs-on: ubuntu-latest

    timeout-minutes: 7


    steps:

      # Checkout the exact failed revision
      - name: Checkout Failed Revision

        uses: actions/checkout@v4

        with:

          ref: ${{ github.event.workflow_run.head_sha }}

          fetch-depth: 2


      # Create fix branch BEFORE Gemini
      - name: Create Fix Branch

        id: branch

        run: |

          BRANCH="ai-fix-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}"

          git switch -c "$BRANCH"

          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"


      # Collect failure information
      - name: Collect Failure Context

        env:

          GH_TOKEN: ${{ github.token }}

          RUN_ID: ${{ github.event.workflow_run.id }}


        run: |

          {

            echo "FAILED WORKFLOW:"

            gh run view "$RUN_ID" \
              --log-failed 2>&1 |
              tail -n 100 || true


            echo

            echo "RECENT APPLICATION CHANGES:"


            git diff HEAD^ HEAD -- app/ || true


          } > failure-context.txt


      # Gemini investigates application
      - name: Diagnose and Repair With Gemini

        env:

          GEMINI_CLI_TRUST_WORKSPACE: "true"


        uses: google-github-actions/run-gemini-cli@v0


        with:

          gemini_api_key: ${{ secrets.LLM_API_KEY }}

          gemini_model: gemini-3.5-flash-lite


          settings: |

            {
              "general": {
                "defaultApprovalMode": "auto_edit",
                "maxAttempts": 1,
                "retryFetchErrors": false,
                "enableAutoUpdate": false
              }
            }


          prompt: |

            Repair this static GitHub Pages application.

            Read:

            - failure-context.txt
            - GEMINI.md

            The application source is located under:

            app/

            Inspect the relevant files inside app/.

            Use the failed workflow information and recent Git changes
            to determine why deployment failed.

            Make the smallest necessary repair.

            Possible failures include:

            - missing files
            - renamed files
            - broken references
            - HTML syntax errors
            - CSS syntax errors
            - JavaScript syntax errors
            - formatting problems
            - indentation problems

            Rules:

            - Apply the fix instead of only explaining it.
            - Modify application files only under app/.
            - Preserve valid behaviour and appearance.
            - Do not modify .github/.
            - Do not weaken validation.
            - Do not expose secrets.
            - Do not install packages.
            - Do not commit or push.
            - Do not create a pull request.
            - Make one repair attempt and stop.


      # Basic guardrails
      - name: Validate AI Repair

        run: |

          set -e


          # Remove temporary AI files
          rm -rf gemini-artifacts

          rm -f failure-context.txt


          # Gemini must not change workflow files
          git diff --quiet -- .github/workflows || {

            git restore .github/workflows

            echo "AI attempted to modify workflow files"

            exit 1

          }


          # Something must have changed
          [ -n "$(git status --porcelain)" ] || {

            echo "AI produced no repair"

            exit 1

          }


          # Application folder must still exist
          [ -d "app" ] || {

            echo "Application folder is missing"

            exit 1

          }


          echo "AI repair passed basic validation"


      # Commit + push + PR
      - name: Create Repair Pull Request

        env:

          GH_TOKEN: ${{ github.token }}

          BRANCH: ${{ steps.branch.outputs.name }}

          FAILED_RUN: ${{ github.event.workflow_run.html_url }}


        run: |

          set -euo pipefail


          # Cleanup Gemini runtime files
          rm -rf gemini-artifacts

          rm -f failure-context.txt


          git config user.name "gemini-self-heal[bot]"

          git config user.email \
            "gemini-self-heal[bot]@users.noreply.github.com"


          # Stage all legitimate repo changes
          git add --all


          if git diff --cached --quiet; then

            echo "::error::No repair remains to commit"

            exit 1

          fi


          echo "Repair changes:"

          git diff --cached --stat


          git commit \
            -m "fix: AI repair for failed deployment"


          git push \
            -u origin "$BRANCH"


          gh pr create \
            --base self-healing \
            --head "$BRANCH" \
            --title "AI Self Heal: Repair failed deployment" \
            --body "Gemini analysed the failed deployment and generated this repair.

          Failed deployment:

          $FAILED_RUN"
          
