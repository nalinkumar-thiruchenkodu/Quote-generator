name: AI Self Heal

on:
  workflow_run:
    workflows: ["Deploy Quote Generator"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Failed Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create Repair Branch
        id: branch
        run: |
          BRANCH="ai-fix-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Collect Failure Context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          {
            echo "## Failed Workflow Logs"
            gh run view "$RUN_ID" --log-failed || true

            echo "## Latest Commit"
            git show --stat --oneline HEAD

            echo "## Latest Changes"
            git diff HEAD^ HEAD || true
          } > failure-context.txt

      - name: Repair With Gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.LLM_API_KEY }}
          gemini_model: gemini-2.5-flash

          settings: |
            {
              "general": {
                "defaultApprovalMode": "auto_edit"
              }
            }

          prompt: |
            Act as a cautious self-healing coding agent.

            Read failure-context.txt, GEMINI.md and inspect the repository.

            Find the actual reason the deployment failed and apply the
            smallest safe repair directly to the working tree.

            The project is a static quote website using:
            - index.html
            - styles.css
            - script.js

            Failures may include:
            - missing or renamed files
            - invalid HTML
            - invalid CSS
            - JavaScript syntax errors
            - formatting problems
            - broken file references
            - unsuitable or meaningless quotes
            - failed health checks

            Rules:
            - Apply the fix; do not only explain it.
            - Preserve valid behaviour, appearance and content.
            - Never modify .github/workflows/.
            - Never weaken validation.
            - Never expose secrets.
            - Do not commit, push or create a pull request.
            - If a safe fix cannot be determined, leave files unchanged.

      - name: Validate Proposed Repair
        run: |
          rm -f failure-context.txt

          git diff --quiet -- .github/workflows || {
            git restore .github/workflows
            echo "Gemini attempted to modify workflow files."
            exit 1
          }

          git diff --quiet && {
            echo "Gemini produced no repair."
            exit 1
          }

          for file in index.html styles.css script.js; do
            test -s "$file" || {
              echo "$file is missing or empty"
              exit 1
            }
          done

          grep -q "styles.css" index.html
          grep -q "script.js" index.html

          node --check script.js

          npm install --no-save \
            prettier@3 \
            html-validate@10 \
            stylelint@16 \
            stylelint-config-standard@39

          printf '%s\n' \
            'export default {' \
            '  extends: ["stylelint-config-standard"]' \
            '};' > stylelint.config.mjs

          npx html-validate index.html
          npx stylelint styles.css
          npx prettier --check index.html styles.css script.js

          rm -rf \
            node_modules \
            package.json \
            package-lock.json \
            stylelint.config.mjs

      - name: Commit Push and Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          FAILED_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          git config user.name "gemini-self-heal[bot]"
          git config user.email \
            "gemini-self-heal[bot]@users.noreply.github.com"

          git add --all

          git commit \
            -m "fix: AI repair for failed deployment"

          git push \
            --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "AI self-heal: repair failed deployment" \
            --body "Gemini analysed the failed run, applied a repair and passed the automated validation checks.

          Failed workflow:
          $FAILED_RUN"
